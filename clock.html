<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Часы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
      background: var(--tg-theme-bg-color, #000);
      color: var(--tg-theme-text-color, #fff);
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .phone-frame {
      width: min(92vw, 320px);
      aspect-ratio: 9 / 19.5;
      max-height: min(92vh, 680px);
      background: var(--tg-theme-bg-color, #1c1c1e);
      border-radius: 44px;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 24px 48px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: var(--tg-theme-bg-color, #1c1c1e);
      border-radius: 0 0 20px 20px;
    }
    .clock-wrap {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    #canvas {
      display: block;
      width: min(100%, 240px);
      height: min(100%, 240px);
      max-width: 240px;
      max-height: 240px;
    }
    .digital {
      margin-top: 16px;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.5));
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="clock-wrap">
      <canvas id="canvas" width="240" height="240"></canvas>
    </div>
    <div class="digital" id="digital">00:00:00</div>
  </div>
  <script>
    (function() {
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var size = 240;
      var center = size / 2;
      var radius = size / 2 - 16;

      function toRad(deg) { return (deg - 90) * Math.PI / 180; }

      function drawFace() {
        ctx.clearRect(0, 0, size, size);
        var strokeColor = 'rgb(50,110,220)';
        var fillColor = 'rgba(50,110,220,0.15)';
        ctx.strokeStyle = strokeColor;
        ctx.fillStyle = fillColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        var i, a, x1, y1, x2, y2, len;
        for (i = 0; i < 60; i++) {
          a = (i / 60) * Math.PI * 2 - Math.PI / 2;
          x1 = center + (radius - 4) * Math.cos(a);
          y1 = center + (radius - 4) * Math.sin(a);
          x2 = center + radius * Math.cos(a);
          y2 = center + radius * Math.sin(a);
          ctx.strokeStyle = i % 5 === 0 ? 'rgb(50,110,220)' : 'rgba(50,110,220,0.5)';
          ctx.lineWidth = i % 5 === 0 ? 2 : 1;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }

      function drawHand(angle, length, width, color) {
        var a = (angle / 360) * Math.PI * 2 - Math.PI / 2;
        var x = center + length * Math.cos(a);
        var y = center + length * Math.sin(a);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      function tick() {
        var now = new Date();
        var h = now.getHours() % 12;
        var m = now.getMinutes();
        var s = now.getSeconds();
        var ms = now.getMilliseconds();
        var hourAngle = (h + m / 60 + s / 3600) * 30;
        var minAngle = (m + s / 60) * 6;
        var secAngle = (s + ms / 1000) * 6;

        drawFace();
        drawHand(hourAngle, radius * 0.45, 6, 'rgb(50,110,220)');
        drawHand(minAngle, radius * 0.7, 5, 'rgb(50,110,220)');
        drawHand(secAngle, radius * 0.82, 3, 'rgb(220,60,60)');

        var dig = document.getElementById('digital');
        dig.textContent = [
          String(now.getHours()).padStart(2, '0'),
          String(m).padStart(2, '0'),
          String(s).padStart(2, '0')
        ].join(':');
      }

      setInterval(tick, 100);
      tick();
    })();
  </script>
</body>
</html>
