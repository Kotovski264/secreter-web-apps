<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Когда связаться</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--tg-theme-bg-color, #000);
      color: var(--tg-theme-text-color, #fff);
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
    }
    .header {
      padding: 20px 16px 12px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.6));
    }
    .picker-wrap {
      position: relative;
      height: 220px;
      margin: 0 8px;
      overflow: hidden;
    }
    .picker-wrap::before,
    .picker-wrap::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 88px;
      pointer-events: none;
      z-index: 1;
    }
    .picker-wrap::before {
      top: 0;
      background: linear-gradient(to bottom, var(--tg-theme-bg-color, #000) 0%, transparent 100%);
    }
    .picker-wrap::after {
      bottom: 0;
      background: linear-gradient(to top, var(--tg-theme-bg-color, #000) 0%, transparent 100%);
    }
    .picker-row {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 220px;
      gap: 4px;
    }
    .wheel {
      flex: 1;
      max-width: 70px;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel-inner {
      padding: 88px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wheel-item {
      height: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.4));
      transition: color 0.15s, font-weight 0.15s;
    }
    .wheel-item.selected {
      color: var(--tg-theme-text-color, #fff);
      font-weight: 400;
    }
    .wheel-day .wheel-item { font-size: 1.75rem; }
    .hint {
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.5));
      text-align: center;
    }
  </style>
</head>
<body>
  <p class="header">Удобная дата для связи</p>
  <div class="picker-wrap">
    <div class="picker-row">
      <div class="wheel wheel-day" id="day-wheel">
        <div class="wheel-inner" id="day-inner"></div>
      </div>
      <div class="wheel" id="month-wheel">
        <div class="wheel-inner" id="month-inner"></div>
      </div>
      <div class="wheel" id="year-wheel">
        <div class="wheel-inner" id="year-inner"></div>
      </div>
    </div>
  </div>
  <p class="hint">Нажмите кнопку внизу</p>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      tg.expand();

      var dayWheel = document.getElementById('day-wheel');
      var monthWheel = document.getElementById('month-wheel');
      var yearWheel = document.getElementById('year-wheel');
      var dayInner = document.getElementById('day-inner');
      var monthInner = document.getElementById('month-inner');
      var yearInner = document.getElementById('year-inner');

      var itemH = 44;
      var padding = 88;
      var months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

      function daysInMonth(month, year) {
        return new Date(year, month + 1, 0).getDate();
      }

      function fillDayWheel(month, year) {
        var n = daysInMonth(month, year);
        dayInner.innerHTML = '';
        for (var d = 1; d <= n; d++) {
          var el = document.createElement('div');
          el.className = 'wheel-item';
          el.textContent = d;
          el.dataset.value = d;
          dayInner.appendChild(el);
        }
        return n;
      }

      function fillMonthWheel() {
        monthInner.innerHTML = '';
        for (var i = 0; i < 12; i++) {
          var el = document.createElement('div');
          el.className = 'wheel-item';
          el.textContent = months[i];
          el.dataset.value = i;
          monthInner.appendChild(el);
        }
      }

      function fillYearWheel() {
        var now = new Date();
        var y = now.getFullYear();
        yearInner.innerHTML = '';
        for (var i = y; i <= y + 2; i++) {
          var el = document.createElement('div');
          el.className = 'wheel-item';
          el.textContent = i;
          el.dataset.value = i;
          yearInner.appendChild(el);
        }
      }

      function updateSelection(wheel, index) {
        var items = wheel.querySelectorAll('.wheel-item');
        items.forEach(function (item, i) {
          item.classList.toggle('selected', i === index);
        });
      }

      function scrollToIndex(wheel, index) {
        var items = wheel.querySelectorAll('.wheel-item');
        if (!items[index]) return;
        var top = padding + index * itemH + (itemH / 2) - (wheel.clientHeight / 2);
        wheel.scrollTo(0, Math.max(0, top));
      }

      function getSelectedIndex(wheel) {
        var center = wheel.scrollTop + (wheel.clientHeight / 2) - padding - (itemH / 2);
        var index = Math.round(center / itemH);
        var count = wheel.querySelectorAll('.wheel-item').length;
        index = Math.max(0, Math.min(index, count - 1));
        return index;
      }

      function onWheelScroll(wheel) {
        var index = getSelectedIndex(wheel);
        updateSelection(wheel, index);
        if (wheel === monthWheel || wheel === yearWheel) {
          var month = getSelectedIndex(monthWheel);
          var year = parseInt(yearWheel.querySelectorAll('.wheel-item')[getSelectedIndex(yearWheel)].dataset.value, 10);
          var oldDay = getSelectedIndex(dayWheel) + 1;
          var maxDay = daysInMonth(month, year);
          if (oldDay > maxDay) oldDay = maxDay;
          fillDayWheel(month, year);
          requestAnimationFrame(function () {
            scrollToIndex(dayWheel, oldDay - 1);
            updateSelection(dayWheel, oldDay - 1);
          });
        }
      }

      fillMonthWheel();
      fillYearWheel();

      var now = new Date();
      var startYear = now.getFullYear();
      var startMonth = now.getMonth();
      var startDay = now.getDate();
      fillDayWheel(startMonth, startYear);

      requestAnimationFrame(function () {
        scrollToIndex(dayWheel, startDay - 1);
        scrollToIndex(monthWheel, startMonth);
        scrollToIndex(yearWheel, 0);
        updateSelection(dayWheel, startDay - 1);
        updateSelection(monthWheel, startMonth);
        updateSelection(yearWheel, 0);
      });

      dayWheel.addEventListener('scroll', function () { onWheelScroll(dayWheel); });
      monthWheel.addEventListener('scroll', function () { onWheelScroll(monthWheel); });
      yearWheel.addEventListener('scroll', function () { onWheelScroll(yearWheel); });

      tg.MainButton.setText('Готово').show().onClick(function () {
        var day = getSelectedIndex(dayWheel) + 1;
        var month = getSelectedIndex(monthWheel);
        var year = parseInt(yearWheel.querySelectorAll('.wheel-item')[getSelectedIndex(yearWheel)].dataset.value, 10);
        var dateStr = year + '-' + (month < 9 ? '0' : '') + (month + 1) + '-' + (day < 10 ? '0' : '') + day;
        tg.sendData(JSON.stringify({ date: dateStr }));
        tg.close();
      });
    })();
  </script>
</body>
</html>
