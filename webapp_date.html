<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Когда связаться</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--tg-theme-bg-color, #000);
      color: var(--tg-theme-text-color, #fff);
      min-height: 100vh;
      -webkit-user-select: none;
      user-select: none;
    }
    .header {
      padding: 16px 16px 8px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.6));
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 16px;
      max-width: 320px;
      margin: 0 auto;
    }
    .nav-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: var(--tg-theme-text-color, #fff);
      font-size: 1.2rem;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s;
    }
    .nav-btn:active { background: rgba(255,255,255,0.2); }
    .nav-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--tg-theme-text-color, #fff);
    }
    .calendar-wrap {
      padding: 0 12px 16px;
      max-width: 320px;
      margin: 0 auto;
    }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 8px;
      text-align: center;
    }
    .weekday {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.5));
      padding: 4px 0;
    }
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .day {
      aspect-ratio: 1;
      max-width: 44px;
      max-height: 44px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 400;
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.4));
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, background 0.15s;
    }
    .day.other-month {
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.25));
    }
    .day.today {
      color: var(--tg-theme-text-color, #fff);
      font-weight: 500;
    }
    .day.selected {
      background: var(--tg-theme-button-color, rgba(255,255,255,0.25));
      color: var(--tg-theme-button-text-color, #fff);
      font-weight: 500;
    }
    .day:not(.other-month):active {
      background: rgba(255,255,255,0.15);
    }
    .hint {
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--tg-theme-hint-color, rgba(255,255,255,0.5));
      text-align: center;
    }
  </style>
</head>
<body>
  <p class="header">Удобная дата для связи</p>
  <div class="nav">
    <button type="button" class="nav-btn" id="prev-month" aria-label="Предыдущий месяц">‹</button>
    <span class="nav-title" id="month-title"></span>
    <button type="button" class="nav-btn" id="next-month" aria-label="Следующий месяц">›</button>
  </div>
  <div class="calendar-wrap">
    <div class="weekdays">
      <span class="weekday">Пн</span>
      <span class="weekday">Вт</span>
      <span class="weekday">Ср</span>
      <span class="weekday">Чт</span>
      <span class="weekday">Пт</span>
      <span class="weekday">Сб</span>
      <span class="weekday">Вс</span>
    </div>
    <div class="days" id="days"></div>
  </div>
  <p class="hint">Нажмите кнопку внизу</p>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      tg.expand();

      var monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
        'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

      var current = new Date();
      var viewYear = current.getFullYear();
      var viewMonth = current.getMonth();
      var selectedDate = null;

      var monthTitle = document.getElementById('month-title');
      var daysEl = document.getElementById('days');
      var prevBtn = document.getElementById('prev-month');
      var nextBtn = document.getElementById('next-month');

      function setSelected(y, m, d) {
        selectedDate = { year: y, month: m, day: d };
      }

      function render() {
        monthTitle.textContent = monthNames[viewMonth] + ' ' + viewYear;
        daysEl.innerHTML = '';

        var first = new Date(viewYear, viewMonth, 1);
        var last = new Date(viewYear, viewMonth + 1, 0);
        var startDow = first.getDay();
        startDow = startDow === 0 ? 6 : startDow - 1;
        var daysInMonth = last.getDate();

        var today = new Date();
        var todayY = today.getFullYear();
        var todayM = today.getMonth();
        var todayD = today.getDate();

        var prevMonth = viewMonth === 0 ? 11 : viewMonth - 1;
        var prevYear = viewMonth === 0 ? viewYear - 1 : viewYear;
        var prevLast = new Date(prevYear, prevMonth + 1, 0).getDate();

        var totalCells = startDow + daysInMonth;
        var rows = Math.ceil(totalCells / 7);
        var total = rows * 7;
        var dayNum = 1;
        var nextDayNum = 1;

        for (var i = 0; i < total; i++) {
          var cell = document.createElement('div');
          cell.className = 'day';

          if (i < startDow) {
            var d = prevLast - startDow + i + 1;
            cell.textContent = d;
            cell.classList.add('other-month');
            cell.dataset.year = prevYear;
            cell.dataset.month = prevMonth;
            cell.dataset.day = d;
          } else if (dayNum <= daysInMonth) {
            cell.textContent = dayNum;
            cell.dataset.year = viewYear;
            cell.dataset.month = viewMonth;
            cell.dataset.day = dayNum;
            if (viewYear === todayY && viewMonth === todayM && dayNum === todayD) {
              cell.classList.add('today');
            }
            if (selectedDate && selectedDate.year === viewYear && selectedDate.month === viewMonth && selectedDate.day === dayNum) {
              cell.classList.add('selected');
            }
            dayNum++;
          } else {
            cell.textContent = nextDayNum;
            cell.classList.add('other-month');
            var nextMonth = viewMonth === 11 ? 0 : viewMonth + 1;
            var nextYear = viewMonth === 11 ? viewYear + 1 : viewYear;
            cell.dataset.year = nextYear;
            cell.dataset.month = nextMonth;
            cell.dataset.day = nextDayNum;
            nextDayNum++;
          }

          cell.addEventListener('click', function () {
            var y = parseInt(this.dataset.year, 10);
            var m = parseInt(this.dataset.month, 10);
            var d = parseInt(this.dataset.day, 10);
            setSelected(y, m, d);
            if (m !== viewMonth || y !== viewYear) {
              viewYear = y;
              viewMonth = m;
              render();
            } else {
              daysEl.querySelectorAll('.day.selected').forEach(function (el) { el.classList.remove('selected'); });
              this.classList.add('selected');
            }
          });
          daysEl.appendChild(cell);
        }
      }

      setSelected(current.getFullYear(), current.getMonth(), current.getDate());
      render();

      prevBtn.addEventListener('click', function () {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        render();
      });
      nextBtn.addEventListener('click', function () {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        render();
      });

      tg.MainButton.setText('Готово').show().onClick(function () {
        var d = selectedDate.day;
        var m = selectedDate.month;
        var y = selectedDate.year;
        var dateStr = y + '-' + (m < 9 ? '0' : '') + (m + 1) + '-' + (d < 10 ? '0' : '') + d;
        tg.sendData(JSON.stringify({ date: dateStr }));
        tg.close();
      });
    })();
  </script>
</body>
</html>
